<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#B23A62" />
    <title>Cuestionario Amai Mochi</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
  /* Self-hosted: the site's CSP only allows fonts from its own origin. */
  @font-face {
    font-family: "Quicksand";
    src: url("/cuestionario/quicksand.woff2") format("woff2");
    font-weight: 300 700;
    font-display: swap;
  }
  @font-face {
    font-family: "Bebas Neue";
    src: url("/cuestionario/bebas-neue.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  /* Layout: one narrow column like the app on a phone; each block is a card, answers are tap targets of 44px+ */
  :root {
    --bg: #fbf5e3;
    --card: #ffffff;
    --fg: #2a2320;
    --muted: #5e5249;
    --line: #eadfcb;
    --accent: #b23a62;
    --accent-ink: #ffffff;
    --accent-soft: #f9d3dc;
    --ok: #8a9a3e;
    --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
    --body: "Quicksand", ui-rounded, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a2320;
      --card: #362d29;
      --fg: #fbf5e3;
      --muted: #cfc3b3;
      --line: #4a3f39;
      --accent: #f9d3dc;
      --accent-ink: #2a2320;
      --accent-soft: #5a3442;
      --ok: #a9b95a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a2320;
    --card: #362d29;
    --fg: #fbf5e3;
    --muted: #cfc3b3;
    --line: #4a3f39;
    --accent: #f9d3dc;
    --accent-ink: #2a2320;
    --accent-soft: #5a3442;
    --ok: #a9b95a;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .logo {
    width: 150px;
    height: 70px;
    background: var(--fg);
    -webkit-mask: url("/cuestionario/logo.png") left center / contain
      no-repeat;
    mask: url("/cuestionario/logo.png") left center / contain no-repeat;
  }
  h1,
  h2 {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: 0.02em;
    text-wrap: balance;
    margin: 0;
  }
  h1 {
    font-size: 44px;
    line-height: 1;
    color: var(--accent);
  }
  h2 {
    font-size: 26px;
    line-height: 1.1;
  }
  .intro {
    margin: 0;
    color: var(--muted);
  }
  .progress {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .bar {
    flex: 1;
    height: 8px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 0.2s;
  }
  section {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .q {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .q > label,
  .q > .qt {
    font-weight: 700;
  }
  .q .hint {
    font-size: 14px;
    color: var(--muted);
    margin-top: -6px;
  }
  .opts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .opt {
    position: relative;
  }
  .opt input {
    position: absolute;
    opacity: 0;
    inset: 0;
    margin: 0;
    cursor: pointer;
  }
  .opt span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 8px 14px;
    border: 1.5px solid var(--line);
    border-radius: 99px;
    font-weight: 600;
    background: var(--bg);
  }
  .opt input:checked + span {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .opt input:focus-visible + span {
    outline: 3px solid var(--accent-soft);
    outline-offset: 2px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid rgb(0 0 0 / 15%);
  }
  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
  }
  textarea {
    min-height: 88px;
    resize: vertical;
  }
  input:focus-visible,
  textarea:focus-visible {
    outline: 3px solid var(--accent-soft);
    border-color: var(--accent);
  }
  .note {
    background: var(--accent-soft);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .note ul {
    margin: 6px 0 0;
    padding-left: 20px;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    min-height: 52px;
    border-radius: 12px;
    border: 0;
    cursor: pointer;
    font: 700 17px var(--body);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    padding: 0 16px;
  }
  .btn.primary {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .btn.ghost {
    background: transparent;
    color: var(--fg);
    border: 1.5px solid var(--line);
  }
  .btn:focus-visible {
    outline: 3px solid var(--accent-soft);
    outline-offset: 2px;
  }
  .status {
    min-height: 24px;
    font-weight: 600;
    color: var(--ok);
    text-align: center;
    margin: 0;
  }
  .status.err {
    color: var(--accent);
  }
  .fine {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .bar span {
      transition: none;
    }
  }

    </style>
  </head>
  <body>
    <main class="wrap">
  <div class="logo" role="img" aria-label="amai mochi"></div>
  <header style="display: flex; flex-direction: column; gap: 8px">
    <h1>Cómo trabajas</h1>
    <p class="intro">
      Eduardo, con esto armo el catálogo, los pedidos y la cobranza de tu app.
      Toca la opción que aplique; si algo no encaja, escríbelo en el cuadro de
      abajo. Toma unos 10 minutos; la última parte es opcional.
    </p>
  </header>
  <div class="progress">
    <div class="bar"><span id="bar"></span></div>
    <span id="count">0 de 0</span>
  </div>
  <form id="form" novalidate></form>
</main>
    <script src="/cuestionario/cuestionario.js"></script>
  </body>
</html>
