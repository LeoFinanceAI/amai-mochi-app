<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Amai Mochi · Pedido desde WhatsApp</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Quicksand:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --bg: #fbf5e3;
        --card: #ffffff;
        --line: #e9dcc0;
        --soft: #f3eada;
        --ink: #2a2320;
        --muted: #5e5249;
        --rosa: #b23a62;
        --rosa-bg: #fdeef2;
        --rosa-ink: #7e2445;
        --ok-bg: #e7efd2;
        --ok-ink: #3e4a14;
        --warn-bg: #fdf0df;
        --warn-ink: #6b3608;
        --wa: #e3f4e6;
        --wa-ink: #1f4a2a;
        --logo: none;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1e1a17;
          --card: #2a2420;
          --line: #3e352e;
          --soft: #342c26;
          --ink: #f5eedf;
          --muted: #c9bba6;
          --rosa: #e06b92;
          --rosa-bg: #3a2029;
          --rosa-ink: #f4b7cb;
          --ok-bg: #2c3419;
          --ok-ink: #cfe09a;
          --warn-bg: #3a2a16;
          --warn-ink: #f3c9a0;
          --wa: #1e3324;
          --wa-ink: #bfe6c8;
          --logo: invert(1);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1e1a17;
        --card: #2a2420;
        --line: #3e352e;
        --soft: #342c26;
        --ink: #f5eedf;
        --muted: #c9bba6;
        --rosa: #e06b92;
        --rosa-bg: #3a2029;
        --rosa-ink: #f4b7cb;
        --ok-bg: #2c3419;
        --ok-ink: #cfe09a;
        --warn-bg: #3a2a16;
        --warn-ink: #f3c9a0;
        --wa: #1e3324;
        --wa-ink: #bfe6c8;
        --logo: invert(1);
        color-scheme: dark;
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Quicksand, system-ui, sans-serif;
      }
      .wrap {
        max-width: 440px;
        margin: 0 auto;
        padding: 20px 18px 40px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .logo {
        display: block;
        width: 130px;
        max-width: 100%;
        margin: 0 auto;
        filter: var(--logo);
      }
      h1 {
        margin: 0;
        font-family: "Bebas Neue", Impact, sans-serif;
        font-weight: 400;
        font-size: 42px;
        line-height: 1;
        color: var(--rosa);
      }
      .sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-weight: 600;
        font-size: 15px;
        line-height: 1.4;
      }
      .lbl {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .chip {
        flex: 0 0 auto;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font:
          600 13px Quicksand,
          sans-serif;
        cursor: pointer;
      }
      textarea {
        width: 100%;
        min-height: 130px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--wa);
        color: var(--wa-ink);
        padding: 14px;
        font:
          500 16px/1.45 Quicksand,
          sans-serif;
        resize: vertical;
      }
      .btn {
        width: 100%;
        min-height: 54px;
        border-radius: 16px;
        border: none;
        background: var(--rosa);
        color: #fff;
        font:
          700 17px Quicksand,
          sans-serif;
        cursor: pointer;
      }
      .btn[aria-busy="true"] {
        opacity: 0.75;
        cursor: progress;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .k {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .v {
        font-size: 16px;
        font-weight: 700;
        text-align: right;
      }
      .items {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--soft);
        border-radius: 14px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--soft);
      }
      .item:last-child {
        border-bottom: none;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 7px;
        flex-shrink: 0;
      }
      .name {
        flex: 1;
        font-weight: 700;
      }
      .step {
        width: 38px;
        height: 38px;
        border-radius: 19px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        font:
          700 18px Quicksand,
          sans-serif;
        cursor: pointer;
      }
      .qty {
        width: 34px;
        text-align: center;
        font-weight: 700;
        font-size: 17px;
      }
      .note {
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }
      .warn {
        background: var(--warn-bg);
        color: var(--warn-ink);
      }
      .ok {
        background: var(--ok-bg);
        color: var(--ok-ink);
      }
      .err {
        background: var(--rosa-bg);
        color: var(--rosa-ink);
      }
      .ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
        font:
          600 15px Quicksand,
          sans-serif;
        min-height: 48px;
        border-radius: 14px;
        cursor: pointer;
        width: 100%;
      }
      .hidden {
        display: none;
      }
      .foot {
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        line-height: 1.4;
      }
    </style>
  </head>

      <div>
        <h1>Pedido desde WhatsApp</h1>
        <p class="sub">
          Pega el mensaje del cliente y la app arma el pedido. Tú solo revisas y
          confirmas.
        </p>
      </div>

      <div>
        <p class="lbl">Prueba con un ejemplo</p>
        <div class="chips" id="examples"></div>
      </div>

      <div>
        <label class="lbl" for="msg" style="display: block"
          >Mensaje del cliente</label
        >
        <textarea
          id="msg"
          placeholder="Pega aquí el mensaje tal como llegó por WhatsApp"
        ></textarea>
      </div>

      <button class="btn" id="go">Crear pedido</button>
      <div id="status" class="note hidden" role="status"></div>

      <div id="result" class="card hidden" aria-live="polite">
        <div class="row">
          <span class="k">Cliente</span><span class="v" id="r-cliente"></span>
        </div>
        <div class="row">
          <span class="k">Entrega</span><span class="v" id="r-fecha"></span>
        </div>
        <div class="row">
          <span class="k">Pago</span><span class="v" id="r-pago"></span>
        </div>
        <div class="row">
          <span class="k">Ubicación</span><span class="v" id="r-ubic"></span>
        </div>
        <div>
          <p class="lbl">Sabores</p>
          <div class="items" id="r-items"></div>
        </div>
        <div class="row">
          <span class="k">Total</span><span class="v" id="r-total"></span>
        </div>
        <div id="r-min" class="note"></div>
        <div id="r-dudas"></div>
        <button class="btn" id="confirm">Confirmar pedido</button>
        <button class="ghost" id="reset">Probar con otro mensaje</button>
      </div>
      <p class="foot">
        Demo para Amai Mochi. Los nombres de clientes son de ejemplo.
      </p>
    </div>

    <script>
      const SABORES = [
        { id: "fresa", n: "Fresa", c: "#EE8FA8" },
        { id: "mango", n: "Mango", c: "#F3C443" },
        { id: "taro", n: "Taro", c: "#A985D1" },
        { id: "chocolate", n: "Chocolate", c: "#8A5A3C" },
        { id: "oreo", n: "Oreo", c: "#6E6E6E" },
        { id: "vainilla", n: "Vainilla", c: "#E3CC8A" },
      ];
      const MINIMO = 40;
      const EJEMPLOS = [
        {
          t: "Distribuidor",
          m: "Buenas tardes! Me mandas 20 de fresa, 15 de mango y 10 de oreo para el jueves porfa. Pago con transferencia 🙏",
        },
        {
          t: "Abreviado",
          m: "hola!! ocupo 2 docenas de taro y una de choco, pa mañana en la tarde. aqui te paso la ubi: Av. Patria 1200, Zapopan",
        },
        {
          t: "Incompleto",
          m: "Que tal, quiero hacer pedido de 30 mochis variados para un evento el sábado, pago en efectivo",
        },
        {
          t: "Con dudas",
          m: "Me puedes mandar lo mismo de la vez pasada pero agrégale 10 de vainilla? Lo ocupo el viernes",
        },
      ];
      const $ = (id) => document.getElementById(id);
      let sample = null,
        pedido = null;
      const ex = $("examples");
      EJEMPLOS.forEach((e) => {
        const b = document.createElement("button");
        b.className = "chip";
        b.textContent = e.t;
        b.onclick = () => {
          $("msg").value = e.m;
        };
        ex.appendChild(b);
      });

      function hoyTexto() {
        const d = new Date();
        return d.toLocaleDateString("es-MX", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }
      function fechaBonita(iso) {
        if (!iso) return null;
        const d = new Date(iso + "T12:00:00");
        if (isNaN(d)) return iso;
        return d.toLocaleDateString("es-MX", {
          weekday: "long",
          day: "numeric",
          month: "long",
        });
      }
      function showStatus(txt, cls) {
        const s = $("status");
        s.className = "note " + cls;
        s.textContent = txt;
      }
      function hideStatus() {
        $("status").className = "note hidden";
      }

      (async () => {
        try {
          sample = await claude.use("sample");
        } catch (e) {
          sample = null;
        }
        if (!sample) {
          showStatus(
            "Esta demo necesita abrirse dentro de Claude para poder leer el mensaje.",
            "err",
          );
          $("go").disabled = true;
        }
      })();

      function prompt(msg) {
        return `Eres el asistente de Amai Mochi, un negocio que vende mochis rellenos de helado por pieza a distribuidores y clientes, con pedidos por WhatsApp. Hoy es ${hoyTexto()} (fecha ISO ${new Date().toISOString().slice(0, 10)}).

Sabores disponibles (usa exactamente estos ids): fresa, mango, taro, chocolate, oreo, vainilla. "choco" es chocolate. Una docena son 12 piezas.

Lee el mensaje del cliente y devuelve SOLO un objeto JSON, sin texto extra, con esta forma:
{"cliente": string|null, "items": [{"sabor": id, "piezas": number}], "piezas_sin_sabor": number, "fecha_entrega": "YYYY-MM-DD"|null, "horario": string|null, "metodo_pago": "efectivo"|"transferencia"|null, "ubicacion": string|null, "dudas": [string]}

Reglas: convierte fechas relativas ("mañana", "el jueves") a la próxima fecha real a partir de hoy. Si pide piezas sin decir sabor (por ejemplo "30 variados"), ponlas en piezas_sin_sabor y no inventes el reparto. Si menciona un sabor que no está en la lista, o se refiere a un pedido anterior que no conoces, agrégalo a dudas. Cada duda es una frase corta en español dirigida al dueño, por ejemplo "Confirmar qué sabores quiere en las 30 piezas variadas". No inventes datos que no estén en el mensaje.

Mensaje del cliente:
"""
${msg}
"""`;
      }

      function render() {
        const r = pedido;
        $("r-cliente").textContent = r.cliente || "Por asignar";
        const f = fechaBonita(r.fecha_entrega);
        $("r-fecha").textContent = f
          ? f + (r.horario ? " · " + r.horario : "")
          : "Sin fecha";
        $("r-pago").textContent = r.metodo_pago
          ? r.metodo_pago === "efectivo"
            ? "Efectivo"
            : "Transferencia"
          : "Sin definir";
        $("r-ubic").textContent = r.ubicacion || "Pedir al cliente";
        const box = $("r-items");
        box.textContent = "";
        SABORES.forEach((s) => {
          const q = r.qty[s.id] || 0;
          if (!q && !r.showAll) return;
          const row = document.createElement("div");
          row.className = "item";
          const dot = document.createElement("span");
          dot.className = "dot";
          dot.style.background = s.c;
          const nm = document.createElement("span");
          nm.className = "name";
          nm.textContent = s.n;
          const minus = document.createElement("button");
          minus.className = "step";
          minus.textContent = "−";
          minus.setAttribute("aria-label", "Quitar 1 de " + s.n);
          minus.onclick = () => {
            r.qty[s.id] = Math.max(0, (r.qty[s.id] || 0) - 1);
            render();
          };
          const qt = document.createElement("span");
          qt.className = "qty";
          qt.textContent = q;
          const plus = document.createElement("button");
          plus.className = "step";
          plus.textContent = "+";
          plus.setAttribute("aria-label", "Agregar 1 de " + s.n);
          plus.onclick = () => {
            r.qty[s.id] = (r.qty[s.id] || 0) + 1;
            render();
          };
          row.append(dot, nm, minus, qt, plus);
          box.appendChild(row);
        });
        if (!r.showAll) {
          const more = document.createElement("button");
          more.className = "ghost";
          more.style.border = "none";
          more.style.minHeight = "44px";
          more.textContent = "+ Agregar otro sabor";
          more.onclick = () => {
            r.showAll = true;
            render();
          };
          box.appendChild(more);
        }
        const asignadas = SABORES.reduce((a, s) => a + (r.qty[s.id] || 0), 0);
        const total = asignadas + (r.sinSabor || 0);
        $("r-total").textContent =
          total + " piezas" + (r.sinSabor ? ` (${r.sinSabor} sin sabor)` : "");
        const m = $("r-min");
        if (total >= MINIMO) {
          m.className = "note ok";
          m.textContent = "Cumple el mínimo de " + MINIMO + " piezas.";
        } else {
          m.className = "note warn";
          m.textContent =
            "Faltan " +
            (MINIMO - total) +
            " piezas para el mínimo de " +
            MINIMO +
            ".";
        }
        const d = $("r-dudas");
        d.textContent = "";
        (r.dudas || []).forEach((t) => {
          const n = document.createElement("div");
          n.className = "note warn";
          n.style.marginTop = "8px";
          n.textContent = "Revisar: " + t;
          d.appendChild(n);
        });
      }

      $("go").onclick = async () => {
        const msg = $("msg").value.trim();
        if (!msg) {
          showStatus("Pega primero un mensaje o elige un ejemplo.", "err");
          return;
        }
        if (!sample) return;
        const b = $("go");
        b.setAttribute("aria-busy", "true");
        b.disabled = true;
        b.textContent = "Leyendo el mensaje…";
        hideStatus();
        $("result").classList.add("hidden");
        try {
          const j = await sample.json(prompt(msg), { modelTier: "quick" });
          const qty = {};
          (j.items || []).forEach((it) => {
            if (SABORES.some((s) => s.id === it.sabor))
              qty[it.sabor] =
                (qty[it.sabor] || 0) +
                Math.max(0, Math.round(Number(it.piezas) || 0));
          });
          pedido = {
            cliente: j.cliente,
            qty,
            sinSabor: Math.max(0, Math.round(Number(j.piezas_sin_sabor) || 0)),
            fecha_entrega: j.fecha_entrega,
            horario: j.horario,
            metodo_pago: j.metodo_pago,
            ubicacion: j.ubicacion,
            dudas: Array.isArray(j.dudas) ? j.dudas : [],
            showAll: false,
          };
          render();
          $("result").classList.remove("hidden");
          $("confirm").textContent = "Confirmar pedido";
          $("confirm").disabled = false;
        } catch (e) {
          const c = e && e.code;
          if (c === "not_granted") {
            showStatus(
              "Sin permiso para usar Claude en esta página. Puedes activarlo desde los permisos del artifact.",
              "err",
            );
          } else if (c === "rate_limited") {
            showStatus(
              "Demasiadas pruebas seguidas. Espera un momento y vuelve a intentar.",
              "err",
            );
          } else {
            showStatus(
              "No pude leer ese mensaje. Intenta de nuevo o revisa el texto.",
              "err",
            );
          }
        } finally {
          b.removeAttribute("aria-busy");
          b.disabled = !sample;
          b.textContent = "Crear pedido";
        }
      };
      $("confirm").onclick = () => {
        $("confirm").textContent = "Pedido guardado ✓";
        $("confirm").disabled = true;
      };
      $("reset").onclick = () => {
        $("result").classList.add("hidden");
        $("msg").value = "";
        $("msg").focus();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    </script>
  </body>
</html>
